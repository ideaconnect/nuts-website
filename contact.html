<section class="max-w-2xl mx-auto px-4 py-16">
  <h1 class="text-4xl font-bold text-gray-900 text-center">Contact Us</h1>
  <p class="mt-4 text-center text-gray-600">Have a question or feedback about NUTS? Send us a message.</p>

  <form action="https://api.staticforms.dev/submit" method="POST" class="mt-10 space-y-6">
    <input type="hidden" name="accessKey" value="sf_kia64la8hgaa65c25fklcecf">
    <input type="hidden" name="redirectTo" value="https://nuts.idct.tech/contact/thanks/">
    <input type="text" name="honeypot" style="display:none">

    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
      <input type="text" name="name" id="name" required
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 placeholder-gray-400 focus:border-nuts-500 focus:ring-nuts-500 focus:outline-none">
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" name="email" id="email" required
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 placeholder-gray-400 focus:border-nuts-500 focus:ring-nuts-500 focus:outline-none">
    </div>

    <div>
      <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
      <textarea name="message" id="message" rows="5" required
        class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 placeholder-gray-400 focus:border-nuts-500 focus:ring-nuts-500 focus:outline-none"></textarea>
    </div>

    <div class="text-center">
      <button type="submit"
        class="inline-block px-8 py-3 rounded-lg bg-nuts-600 text-white font-semibold hover:bg-nuts-700 transition">
        Send Message
      </button>
    </div>
  </form>
</section>
